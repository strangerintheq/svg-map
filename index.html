<!DOCTYPE html>
<html lang="en">
<head>
    <meta name=”viewport” content=”width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0;”/>
    <meta charset="UTF-8">
    <script src="math.js"></script>
    <script src="svgmap.js"></script>
</head>
<body>
<div id="map1" style="width: 500px; height: 500px;display: inline-block"></div>
<div id="map2" style="width: 600px; height: 600px;display: inline-block"></div>
<script>
    let osmLoadFn = (z, x, y) => `https://a.tile.openstreetmap.org/${z}/${x}/${y}.png`;
    let arcGisLoadFn = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;

    let map = svgMap(map1);

    map.tiles(osmLoadFn)
    map.setCenter(60, 30.2, 10);
    map.setHeading(45)
    map.add(`<polyline data-points='[[60,30.2],[60.1,30.2],[60,30.3]]'
                fill='none' stroke-width='3' stroke='red'></polyline>`)
    map.add("<circle data-point='[60,30.2]' r='15'></circle>")


    map = svgMap(map2);
    map.tiles(arcGisLoadFn)
    map.setCenter(60, 30.2, 5);
    map.setHeading(133)
    map.add(`<polyline data-points='[[60,30.2],[60,130.2]]'
                fill='none' stroke-width='2' stroke='red'></polyline>`)
    map.onClick((ll) => console.log(ll))
    map.addGui(`<div style="display: inline-block; pointer-events: all">
        <button onclick="map.tiles(osmLoadFn)">osm</button>
        <button onclick="map.tiles(arcGisLoadFn)">arcGis</button>
      </div>`)
</script>
</body>
</html>
