<!DOCTYPE html>
<html lang="en">
<head>
    <meta name=”viewport” content=”width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0;”/>
    <meta charset="UTF-8">
</head>
<body style="user-select:none;touch-action: none; margin: 0; overflow: hidden; height: 100vh">
<script>
    makeMap(document.body);

    function makeMap(targetNode) {
        const {PI, sin, cos, log, tan, hypot, atan2, max, log2, exp, atan} = Math;
        let count = 0;
        let pointers = {};
        let needRepaint = true;
        let touchCfgChanged = false;
        let tileSize, viewport, w, h, x = 0, y = 0, z = 5, a = 0;
        targetNode.innerHTML = `<svg><g id="basemap"></g><g id="overlay"></g><g id="cursor"></g></svg>`;
        let svg = targetNode.querySelector("svg");
        let basemap = svg.querySelector("#basemap");
        let overlay = svg.querySelector("#overlay");
        let cur = svg.querySelector("#cursor");
        let start;
        let cursor = [0, 0]
        let tilesCache = {};
        let points = [[0, 0], [60, 30.2]];
        resize();
        requestAnimationFrame(function animate() {
            if (needRepaint) {
                calcTiles();
                calcOverlay();
                needRepaint = false;
            }
            requestAnimationFrame(animate);
        })
        addEventListener("wheel", e => applyZoom(e.clientX, e.clientY, z, e.deltaY < 0 ? 1.1 : 0.9));
        addEventListener("pointerdown", down);
        addEventListener("pointermove", move);
        addEventListener("pointerup", up);

        function project([lat, lon]) {
            let s = tileSize / 2 * z;
            lat = -log(tan(PI / 4 + lat / 360 * PI))
            return [lon / 180 * s + x, lat / PI * s + y];
        }

        function unProject([px, py]) {
            let s = tileSize / 2 * z;
            let lat = PI / 4 - atan(exp((py - y) / s * PI))
            return [lat / PI * 360, (px - x) / s * 180]
        }

        function calcOverlay() {
            overlay.innerHTML = points.map(project).map(p => circle(...p, 5)).join("");
        }

        function transform() {
            let v = Object.values(pointers);
            let p0 = v[0];
            let p1 = v[1] || p0;
            if (p0) {
                if (touchCfgChanged) {
                    start = {x, y, z, a};
                    touchCfgChanged = false;
                    Object.values(pointers).forEach(p => p.x = p.ex, p.y = p.ey)
                }
                let x0 = p0.x / 2 + p1.x / 2;
                let y0 = p0.y / 2 + p1.y / 2;
                let x1 = p0.ex / 2 + p1.ex / 2;
                let y1 = p0.ey / 2 + p1.ey / 2;
                if (p0 !== p1) {
                    let d0 = hypot(p0.x - p1.x, p0.y - p1.y);
                    let d1 = hypot(p0.ex - p1.ex, p0.ey - p1.ey);
                    let kz = d1 / d0;
                    x = start.x - x0 / kz + x1 / kz;
                    y = start.y - y0 / kz + y1 / kz;
                    applyZoom(x0, y0, start.z, kz);
                    let a0 = atan2(p1.y - p0.y, p1.x - p0.x);
                    let a1 = atan2(p1.ey - p0.ey, p1.ex - p0.ex);
                    a = start.a + a1 - a0;
                } else {
                    x = start.x - x0 + x1;
                    y = start.y - y0 + y1;
                }
                needRepaint = true;
            } else {
                start = null;
            }
        }

        function down(e) {
            if (e.isPrimary) {
                pointers = {};
                count = 0;
            }
            if (count === 2)
                return;
            count++;
            touchCfgChanged = true;
            let x = e.clientX;
            let y = e.clientY;
            pointers[e.pointerId] = {x, y, ex: x, ey: y};
            transform();
        }

        function move(e) {
            cursor = [e.clientX - w / 2, e.clientY - h / 2];
            cur.innerHTML = `<text x="${cursor[0] + 20}" y="${cursor[1] + 20}">${unProject(cursor)}</text>`
            let p = pointers[e.pointerId];
            if (!p)
                return;
            p.ex = e.clientX;
            p.ey = e.clientY;
            transform();
        }

        function up(e) {
            if (!pointers[e.pointerId])
                return;
            count--;
            touchCfgChanged = true;
            delete pointers[e.pointerId];
            transform();
        }

        function resize() {
            w = targetNode.clientWidth;
            h = targetNode.clientHeight;
            tileSize = max(w, h) / 4;
            let pad = 0;
            viewport = {left: -w / 2 + pad, top: -h / 2 + pad, right: w / 2 - pad, bottom: h / 2 - pad};
            svg.setAttribute("viewBox", [-w / 2, -h / 2, w, h].toString());
            svg.setAttribute("width", w + "px");
            svg.setAttribute("height", h + "px");
        }

        function tile(x, y, s, tz, tx, ty) {
            return {x, y, s, tz, tx, ty};
        }

        function subdivide({x, y, s, tz, tx, ty}) {
            let d = s / 2, t = d / 2, TZ = tz + 1,
                TX = tx * 2, TY = ty * 2;
            return [
                tile(x - t, y - t, d, TZ, TX, TY),
                tile(x + t, y - t, d, TZ, TX + 1, TY),
                tile(x + t, y + t, d, TZ, TX + 1, TY + 1),
                tile(x - t, y + t, d, TZ, TX, TY + 1)
            ];
        }

        function inViewport({x, y, s}) {
            return x + s / 2 > viewport.left
                && x - s / 2 < viewport.right
                && y + s / 2 > viewport.top
                && y - s / 2 < viewport.bottom;
        }

        function calcTiles() {
            basemap.innerHTML = "";
            let s = tileSize * z;
            let tiles = [tile(x, y, s, 0, 0, 0)];
            for (let i = 1; i < log2(z); i++)
                tiles = tiles.map(subdivide).flat().filter(inViewport);
            tiles.forEach(drawTile);
            let actualTilesKeys = tiles.map(tileKey);
            Object.keys(tilesCache)
                .filter(key => !actualTilesKeys.includes(key))
                .forEach(key => delete tilesCache[key]);
        }

        function tileKey({tx, ty, tz}) {
            return `x${tx}y${ty}z${tz}`;
        }

        function drawTile(tile) {
            let {x, y, s, tx, ty, tz} = tile;
            let key = tileKey(tile);
            let img = tilesCache[key];
            if (!img) {
                img = tilesCache[key] = document.createElementNS("http://www.w3.org/2000/svg", "image");
                img.setAttribute("href", `https://tile.openstreetmap.de/${tz}/${tx}/${ty}.png`);
            }
            basemap.append(img);
            img.setAttribute("x", x - s / 2)
            img.setAttribute("y", y - s / 2)
            img.setAttribute("width", s)
            img.setAttribute("height", s)
        }

        function applyZoom(x0, y0, startZ, kz) {
            if (startZ * kz > 2 ** 20 || startZ * kz < 5)
                return
            let hw = w / 2, hh = h / 2;
            let r = atan2(y - y0 + hh, x - x0 + hw);
            let d = hypot(x - x0 + hw, y - y0 + hh) * kz;
            x = cos(r) * d + x0 - hw;
            y = sin(r) * d + y0 - hh;
            z = startZ * kz;
            needRepaint = true
        }

        function circle(x, y, r) {
            return `<circle r="${r}" cx="${x}" cy="${y}"></circle>`
        }
    }
</script>
</body>
</html>
